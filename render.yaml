services:
  - type: web
    name: our-home
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
    databases:
      - name: our-home-db
        type: postgresql
        plan: free
        databaseName: ourhome
        user: ourhome