<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#3478f6" />
    <title>Our Home — Our Money, Our Future</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("oh_theme") || "system";
          var d = t === "dark" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", !!d);
          var l = localStorage.getItem("oh_locale") || "en";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <script src="/js/i18n.js"></script>
    <script src="/js/store.js"></script>
    <script src="/js/dom.js"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/pages.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
